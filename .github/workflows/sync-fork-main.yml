name: Sync fork main from upstream

on:
  workflow_dispatch:
  schedule:
    # Run away from the top of the hour to reduce scheduled-run delays.
    - cron: '17 * * * *'

concurrency:
  group: sync-fork-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync main with the parent repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fast-forward fork main from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            --data '{"branch":"main"}'
